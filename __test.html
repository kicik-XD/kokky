<!doctype html>
<html>
  <head><meta charset="utf-8"><title>yt test</title></head>
  <body style="margin:0">
    <div id="p"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      window.log = [];
      window.onYouTubeIframeAPIReady = function () {
        window.player = new YT.Player("p", {
          height: "240",
          width: "320",
          videoId: new URLSearchParams(location.search).get("v") || "dQw4w9WgXcQ",
          playerVars: { autoplay: 1, origin: location.origin, playsinline: 1 },
          events: {
            onReady: function (e) {
              log.push("ready");
              e.target.playVideo();
            },
            onStateChange: function (e) {
              log.push("state:" + e.data);
            },
            onError: function (e) {
              log.push("error:" + e.data);
            },
          },
        });
      };
    </script>
  </body>
</html>
