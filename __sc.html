<!doctype html>
<html>
  <head><meta charset="utf-8"><title>sc test</title></head>
  <body style="margin:0">
    <iframe id="sc" width="100%" height="166" frameborder="0" allow="autoplay"></iframe>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
      window.log = [];
      const params = new URLSearchParams(location.search);
      const track = params.get("id") || "155876731";
      const frame = document.getElementById("sc");
      frame.src =
        "https://w.soundcloud.com/player/?url=" +
        encodeURIComponent("https://api.soundcloud.com/tracks/" + track) +
        "&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false";
      window.widget = SC.Widget(frame);
      widget.bind(SC.Widget.Events.READY, function () {
        log.push("ready");
        widget.getDuration(function (d) { log.push("dur:" + d); });
        widget.play();
      });
      widget.bind(SC.Widget.Events.PLAY, function () { log.push("play"); });
      widget.bind(SC.Widget.Events.PAUSE, function () { log.push("pause"); });
      widget.bind(SC.Widget.Events.ERROR, function (e) { log.push("error:" + JSON.stringify(e)); });
      widget.bind(SC.Widget.Events.FINISH, function () { log.push("finish"); });
    </script>
  </body>
</html>
